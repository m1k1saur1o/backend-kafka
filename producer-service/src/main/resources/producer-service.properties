# Configuracion versionada de producer-service.
# NO contiene secretos ni direcciones: todo valor sensible o de entorno llega por variables de entorno.
# Para overrides locales crea ./application.properties (ignorado por git).

spring.application.name=producer-service
server.port=${SERVER_PORT:8081}

# ---------- Validacion JWT (OAuth2 Resource Server) ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:sumativa3-auth-service}
app.jwt.audience=${JWT_AUDIENCE:notificaciones-api}

# ---------- Kafka ----------
# Ej. Docker: kafka-1:9092,kafka-2:9092,kafka-3:9092 | EC2: ip-10-0-1-10.ec2.internal:9092,...
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
app.kafka.topic=${KAFKA_TOPIC:Notificaciones}
app.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.kafka.replicas=${KAFKA_TOPIC_REPLICAS:3}
app.kafka.send-timeout=${KAFKA_SEND_TIMEOUT_MS:15000}ms

# Topico de auditoria de llamadas a ms-bff (contrato BffCallEventDTO v1). Separado de Notificaciones.
app.kafka.auditoria.topic=${BFF_EVENTS_TOPIC:bff-call-events}
app.kafka.auditoria.partitions=${BFF_EVENTS_TOPIC_PARTITIONS:${app.kafka.partitions}}
app.kafka.auditoria.replicas=${BFF_EVENTS_TOPIC_REPLICAS:${app.kafka.replicas}}
app.kafka.auditoria.retention=${BFF_EVENTS_RETENTION_MS:604800000}ms

spring.kafka.bootstrap-servers=${app.kafka.bootstrap-servers}
spring.kafka.client-id=${KAFKA_CLIENT_ID:producer-service}
spring.kafka.admin.auto-create=${KAFKA_TOPIC_AUTO_CREATE:true}
spring.kafka.admin.fail-fast=false

spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:10000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:15000}

# Seguridad cliente-broker (opcional). PLAINTEXT por defecto; para SASL definir
# KAFKA_SECURITY_PROTOCOL=SASL_SSL|SASL_PLAINTEXT, KAFKA_SASL_MECHANISM y KAFKA_SASL_JAAS_CONFIG.
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# ---------- Resilience4j (instancia kafkaProducer) ----------
# Circuit Breaker: con al menos CB_MINIMUM_CALLS llamadas en una ventana de CB_SLIDING_WINDOW_SIZE,
# si el % de fallos >= CB_FAILURE_RATE_THRESHOLD el circuito se abre durante CB_WAIT_OPEN_SECONDS
# y las solicitudes responden 503 (circuit_open) de inmediato. Luego pasa a semiabierto y prueba de nuevo.
resilience4j.circuitbreaker.instances.kafkaProducer.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaProducer.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.kafkaProducer.minimum-number-of-calls=${CB_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.kafkaProducer.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.kafkaProducer.wait-duration-in-open-state=${CB_WAIT_OPEN_SECONDS:30}s
resilience4j.circuitbreaker.instances.kafkaProducer.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaProducer.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.kafkaProducer.record-exceptions=com.example.producer_service.exception.PublicacionException

# Retry: intentos totales (incluye el primero) y espera entre intentos. Solo reintenta PublicacionException;
# con el circuito abierto (CircuitoAbiertoException) no se reintenta.
resilience4j.retry.instances.kafkaProducer.max-attempts=${KAFKA_PUBLISH_RETRY_ATTEMPTS:2}
resilience4j.retry.instances.kafkaProducer.wait-duration=${KAFKA_PUBLISH_RETRY_WAIT_MS:500}ms
resilience4j.retry.instances.kafkaProducer.retry-exceptions=com.example.producer_service.exception.PublicacionException

# ---------- Resilience4j (instancia kafkaAuditoria: mismos parametros, circuito independiente) ----------
resilience4j.circuitbreaker.instances.kafkaAuditoria.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaAuditoria.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.kafkaAuditoria.minimum-number-of-calls=${CB_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.kafkaAuditoria.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.kafkaAuditoria.wait-duration-in-open-state=${CB_WAIT_OPEN_SECONDS:30}s
resilience4j.circuitbreaker.instances.kafkaAuditoria.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaAuditoria.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.kafkaAuditoria.record-exceptions=com.example.producer_service.exception.PublicacionException
resilience4j.retry.instances.kafkaAuditoria.max-attempts=${KAFKA_PUBLISH_RETRY_ATTEMPTS:2}
resilience4j.retry.instances.kafkaAuditoria.wait-duration=${KAFKA_PUBLISH_RETRY_WAIT_MS:500}ms
resilience4j.retry.instances.kafkaAuditoria.retry-exceptions=com.example.producer_service.exception.PublicacionException

# ---------- Eureka (registro en discovery-service) ----------
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/health

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never
