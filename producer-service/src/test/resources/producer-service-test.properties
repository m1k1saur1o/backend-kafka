# Valores exclusivos para pruebas automatizadas (no son credenciales reales)
app.jwt.secret=test-secret-solo-para-pruebas-0123456789abcdef
app.jwt.issuer=test-issuer
app.jwt.audience=test-audience
app.kafka.bootstrap-servers=test-broker:9092
spring.kafka.admin.auto-create=false
# Resilience4j con valores pequeños para pruebas rápidas y deterministas
resilience4j.retry.instances.kafkaProducer.max-attempts=2
resilience4j.retry.instances.kafkaProducer.wait-duration=10ms
resilience4j.circuitbreaker.instances.kafkaProducer.sliding-window-size=4
resilience4j.circuitbreaker.instances.kafkaProducer.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.kafkaProducer.wait-duration-in-open-state=60s
resilience4j.retry.instances.kafkaAuditoria.max-attempts=2
resilience4j.retry.instances.kafkaAuditoria.wait-duration=10ms
resilience4j.circuitbreaker.instances.kafkaAuditoria.sliding-window-size=4
resilience4j.circuitbreaker.instances.kafkaAuditoria.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.kafkaAuditoria.wait-duration-in-open-state=60s
eureka.client.enabled=false
