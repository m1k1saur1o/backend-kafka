# Configuracion versionada de auth-service.
# NO contiene secretos: todos los valores sensibles se leen desde variables de entorno.
# Para overrides locales crea ./application.properties (ignorado por git)
# a partir de application.properties.example.

spring.application.name=auth-service
server.port=${SERVER_PORT:8080}

# Usuario habilitado (obligatorios, sin valor por defecto)
app.auth.username=${AUTH_USERNAME:}
app.auth.password=${AUTH_PASSWORD:}
app.auth.roles=${AUTH_ROLES:USER,ADMIN}

# Cliente de servicio para el grant client_credentials (POST /auth/token). Vacio = deshabilitado.
# Lo usa ms-bff para publicar eventos de auditoria en producer-service.
app.auth.client.id=${AUTH_CLIENT_ID:}
app.auth.client.secret=${AUTH_CLIENT_SECRET:}
app.auth.client.roles=${AUTH_CLIENT_ROLES:AUDIT_PUBLISHER}

# JWT (el secreto es obligatorio y debe ser identico en producer-service, consumer-service y ms-bff)
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:sumativa3-auth-service}
app.jwt.audience=${JWT_AUDIENCE:notificaciones-api}
# Audiencias adicionales separadas por coma (ej. bff-api para ms-bff)
app.jwt.extra-audiences=${JWT_EXTRA_AUDIENCES:}
app.jwt.expiration=${JWT_EXPIRATION_SECONDS:3600}s

# Resilience4j Rate Limiter del login (freno a fuerza bruta).
# Permite AUTH_LOGIN_RATE_LIMIT solicitudes cada AUTH_LOGIN_RATE_PERIOD_SECONDS; el exceso responde 429 sin esperar.
resilience4j.ratelimiter.instances.login.limit-for-period=${AUTH_LOGIN_RATE_LIMIT:10}
resilience4j.ratelimiter.instances.login.limit-refresh-period=${AUTH_LOGIN_RATE_PERIOD_SECONDS:60}s
resilience4j.ratelimiter.instances.login.timeout-duration=0s

# Rate Limiter de POST /auth/token (los clientes cachean el token, por lo que el volumen esperado es bajo)
resilience4j.ratelimiter.instances.clientToken.limit-for-period=${AUTH_TOKEN_RATE_LIMIT:30}
resilience4j.ratelimiter.instances.clientToken.limit-refresh-period=${AUTH_TOKEN_RATE_PERIOD_SECONDS:60}s
resilience4j.ratelimiter.instances.clientToken.timeout-duration=0s

# ---------- Eureka (registro en discovery-service) ----------
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/health

# Actuator: solo health, sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never
