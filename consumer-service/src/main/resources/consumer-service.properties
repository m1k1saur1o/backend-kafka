# Configuracion versionada de consumer-service.
# NO contiene secretos ni direcciones: todo valor sensible o de entorno llega por variables de entorno.
# Para overrides locales crea ./application.properties (ignorado por git).

spring.application.name=consumer-service
server.port=${SERVER_PORT:8082}

# ---------- Validacion JWT (OAuth2 Resource Server) ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:sumativa3-auth-service}
app.jwt.audience=${JWT_AUDIENCE:notificaciones-api}

# ---------- Kafka ----------
# Ej. Docker: kafka-1:9092,kafka-2:9092,kafka-3:9092 | EC2: ip-10-0-1-10.ec2.internal:9092,...
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
app.kafka.topic=${KAFKA_TOPIC:Notificaciones}
app.kafka.group-id=${KAFKA_CONSUMER_GROUP_ID:notificaciones-consumer}
app.kafka.listener-id=${KAFKA_LISTENER_ID:notificacionListener}
app.kafka.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
app.kafka.retry-attempts=${KAFKA_RETRY_ATTEMPTS:3}
app.kafka.retry-backoff=${KAFKA_RETRY_BACKOFF_MS:1000}ms
app.kafka.history-size=${CONSUMER_HISTORY_SIZE:100}

spring.kafka.bootstrap-servers=${app.kafka.bootstrap-servers}
spring.kafka.client-id=${KAFKA_CLIENT_ID:consumer-service}
spring.kafka.consumer.group-id=${app.kafka.group-id}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.consumer_service.dto.NotificacionDTO
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.consumer_service.dto
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
spring.kafka.listener.missing-topics-fatal=false

# Seguridad cliente-broker (opcional). PLAINTEXT por defecto; para SASL definir
# KAFKA_SECURITY_PROTOCOL=SASL_SSL|SASL_PLAINTEXT, KAFKA_SASL_MECHANISM y KAFKA_SASL_JAAS_CONFIG.
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never
