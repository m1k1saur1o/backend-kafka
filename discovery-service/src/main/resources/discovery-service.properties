# Configuracion versionada de discovery-service (Eureka Server).
# NO contiene secretos: las credenciales se leen desde variables de entorno.

spring.application.name=discovery-service
server.port=${SERVER_PORT:8761}

# Credenciales HTTP Basic del registro (obligatorias)
app.eureka.username=${EUREKA_USERNAME:}
app.eureka.password=${EUREKA_PASSWORD:}

# Servidor standalone: no se registra a si mismo ni replica con otros peers
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Entorno de laboratorio con pocas instancias: sin self-preservation, las replicas detenidas
# se eliminan del registro en ~30-40 s en lugar de quedar como instancias fantasma.
# En produccion con muchas instancias conviene EUREKA_SELF_PRESERVATION=true.
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=${EUREKA_EVICTION_INTERVAL_MS:10000}
eureka.server.response-cache-update-interval-ms=5000
eureka.server.wait-time-in-ms-when-sync-empty=0

# Actuator: solo health, sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never
